<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="Profile-card">
      <div class="Image">
        <img src="./iqbal.jpg" alt="" class="profile-img" />
      </div>
      <div class="text-data">
        <span class="name">Iqbal Majidi</span>
        <span class="job">Web Designer & Uni Student </span>
      </div>
      <div class="social-media">
        <a
          href="https://www.instagram.com/iqbalmajidi/"
          target="_blank"
          style="
            background: linear-gradient(
              45deg,
              #f58529,
              #dd2a7b,
              #8134af,
              #515bd4
            );
            box-shadow: 0px 4px 10px rgba(221, 42, 123, 0.4);
          "
        >
          <i class="fab fa-instagram"></i
        ></a>
        <a
          href=""
          style="
            background: linear-gradient(135deg, #1da1f2, #0d8bd9);
            box-shadow: 0px 4px 10px rgba(29, 161, 242, 0.4);
          "
        >
          <i class="fab fa-twitter"></i
        ></a>
        <a
          href="#"
          style="
            background: linear-gradient(135deg, #0a66c2, #004182);
            box-shadow: 0px 4px 10px rgba(10, 102, 194, 0.4);
          "
        >
          <i class="fab fa-linkedin-in"></i
        ></a>
        <a
          href="#"
          style="
            background: linear-gradient(135deg, #181717, #24292e);
            box-shadow: 0px 4px 10px rgba(24, 23, 23, 0.4);
          "
        >
          <i class="fab fa-github"></i
        ></a>
      </div>
      <div class="buttons">
        <button class="button">Subscribe</button>
        <button class="button">Message</button>
      </div>

      <div class="analytics">
        <div class="date">
          <i class="fa-regular fa-heart"></i>
          <span class="number">60k</span>
        </div>

        <div class="date">
          <i class="bx bx-message-rounded"></i>
          <span class="number">20k</span>
        </div>

        <div class="date">
          <i class="bx bx-share"></i>
          <span class="number">12k</span>
        </div>
      </div>
    </div>
  </body>
</html>
